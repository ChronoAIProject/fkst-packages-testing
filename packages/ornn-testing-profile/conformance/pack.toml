schema = 1
runner_protocol = "fkst-declarative-rulepack@1"
owner_package = "ornn-testing-profile"

[[rules]]
id = "ornn-profile-localhost-only"
severity = "error"
kind = "text_forbid_regex"
include = ["**/*.lua"]
exclude = ["tests/**"]
pattern = "https://|http://[^l1]"
message = "Ornn local testing profile must not embed non-local online URLs"
