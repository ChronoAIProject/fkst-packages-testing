schema = 1
runner_protocol = "fkst-declarative-rulepack@1"
owner_package = "test-artifacts"

[[rules]]
id = "artifact-summary-pointer-only"
severity = "error"
kind = "text_forbid_regex"
include = ["core.lua", "departments/**/*.lua", "raisers/**/*.lua", "packages/test-artifacts/core.lua", "packages/test-artifacts/departments/**/*.lua", "packages/test-artifacts/raisers/**/*.lua"]
exclude = ["tests/**", "packages/test-artifacts/tests/**"]
pattern = "full_report|raw_stdout|raw_stderr|screenshot_body|trace_body"
message = "test-artifacts summaries must carry stable artifact pointers, not report bodies"
