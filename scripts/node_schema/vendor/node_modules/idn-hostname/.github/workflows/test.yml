# Verify every public fixture from the first Unicode-15.1-capable LTS release onward.
name: Cross-platform tests

on:
  push:
    branches: [release/15.1]
  pull_request:
  workflow_dispatch:

# Tests need read access to the project and its public workspace-data source.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node.js ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20.12.0, 22, 24, 26]

    steps:
      # Check out the exact project revision selected by the workflow event.
      - name: Check out repository
        uses: actions/checkout@v7

      # Test the exact minimum LTS runtime and each current compatible even-numbered line.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # Install the package's runtime and type-development dependencies.
      - name: Install dependencies
        run: npm install

      # Check out only this project's test concern from the public workspace-data source.
      - name: Check out public tests
        uses: actions/checkout@v7
        with:
          repository: SorinGFS/public-data
          ref: master
          path: workspace-data
          sparse-checkout: tests/github.com/SorinGFS/idn-hostname

      # Check out the extension-owned runtime helper required by materialized dispatchers.
      - name: Check out workspace runtime
        uses: actions/checkout@v7
        with:
          repository: SorinGFS/gh-workspace-data
          ref: v0.5.0
          path: workspace-runtime
          sparse-checkout: src/version-layers.js
          sparse-checkout-cone-mode: false

      # Reproduce the ordinary workspace layout generated by gh-workspace-data.
      - name: Materialize public tests and runtime
        run: >-
          node -e "const fs = require('node:fs'); fs.cpSync('workspace-data/tests/github.com/SorinGFS/idn-hostname', '#/public/tests', { recursive: true }); fs.copyFileSync('workspace-runtime/src/version-layers.js', '#/version-layers.js')"

      # Execute every materialized Node.js test and propagate any failed assertion.
      - name: Run tests
        run: npm test
