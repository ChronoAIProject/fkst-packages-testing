schema = 1
runner_protocol = "fkst-declarative-rulepack@1"
owner_package = "testing-pipeline"

[[rules]]
id = "testing-pipeline-no-product-hardcoding"
severity = "error"
kind = "text_forbid_regex"
include = ["**/*.lua"]
exclude = ["tests/**"]
pattern = "raw_report|full_report|attachment_body|screenshot_body|raw_stdout|raw_stderr|trace_body|cookie|password|token|ornn|ORNN|redemption"
message = "testing pipeline composition must stay generic and carry artifact pointers, not product defaults or report bodies"
