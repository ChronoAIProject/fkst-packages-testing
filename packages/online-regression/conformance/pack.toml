schema = 1
runner_protocol = "fkst-declarative-rulepack@1"
owner_package = "online-regression"

[[rules]]
id = "online-regression-no-fixed-host-config"
severity = "error"
kind = "text_forbid_regex"
include = ["**/*.lua"]
exclude = ["tests/**", "packages/online-regression/tests/**"]
pattern = "(https?://[A-Za-z0-9.-]+|(APP|HOST)_[A-Z0-9_]+)"
message = "online regression must not encode fixed application endpoints or host environment conventions"
