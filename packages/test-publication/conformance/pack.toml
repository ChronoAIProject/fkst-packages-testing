schema = 1
runner_protocol = "fkst-declarative-rulepack@1"
owner_package = "test-publication"

[[rules]]
id = "publication-pointer-only"
severity = "error"
kind = "text_forbid_regex"
include = ["core.lua", "departments/**/*.lua", "raisers/**/*.lua", "packages/test-publication/core.lua", "packages/test-publication/departments/**/*.lua", "packages/test-publication/raisers/**/*.lua"]
exclude = ["tests/**", "packages/test-publication/tests/**"]
pattern = "raw_report|full_report|attachment_body|screenshot_body|raw_stdout|raw_stderr|trace_body|cookie|password|token"
message = "test publication handoff must carry artifact pointers and small notification fields, not report bodies or credentials"
