[workspace]
# fkst-packages-testing owns testing-domain packages and local testing libraries. The generic
# development control plane is consumed from the pinned, read-only fkst-packages source below.
units = [
  "packages/*",
  "libraries/contract",
  ".fkst/local-libraries/forge",
  "libraries/testing_ai",
  "libraries/testing_package_executor",
  "libraries/testing_runtime",
  "libraries/testkit",
  "libraries/workflow",
]
packages = ["packages/*"]
libraries = [
  "libraries/contract",
  ".fkst/local-libraries/forge",
  "libraries/testing_ai",
  "libraries/testing_package_executor",
  "libraries/testing_runtime",
  "libraries/testkit",
  "libraries/workflow",
]

[registries]
workspace = "workspace"

[[external_sources]]
id = "fkst-packages-platform"
git = "https://github.com/ChronoAIProject/fkst-packages.git"
rev = "d4146d7bbdbde9d6fbbee404d5a2e3e4da0fa08c"
libraries = ["forge", "devloop"]
packages = [
  "github-proxy",
  "consensus",
  "github-devloop-intake",
  "github-devloop-workflow",
  "github-devloop",
  "github-devloop-pr",
  "github-devloop-decompose",
  "github-devloop-integration",
]
