schema = 1
runner_protocol = "fkst-declarative-rulepack@1"
owner_package = "platform-test-loop"

[[rules]]
id = "generic-platform-loop-no-product-hardcoding"
severity = "error"
kind = "text_forbid_regex"
include = ["**/*.lua"]
exclude = ["tests/**"]
pattern = "(localhost:[0-9]+|APP_[A-Z0-9_]+|sample_module)"
message = "platform-test-loop must stay generic; host-specific defaults belong downstream"
