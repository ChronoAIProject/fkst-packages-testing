schema = 1
runner_protocol = "fkst-declarative-rulepack@1"
owner_package = "module-testing-pipeline"

[[rules]]
id = "module-testing-pipeline-pointer-only"
severity = "error"
kind = "text_forbid_regex"
include = ["**/*.lua"]
exclude = ["tests/**", "packages/module-testing-pipeline/tests/**"]
pattern = "raw_report|full_report|attachment_body|screenshot_body|raw_stdout|raw_stderr|trace_body|cookie|password|token"
message = "module testing pipeline composition must carry bounded fields and artifact pointers, not report bodies or credentials"
