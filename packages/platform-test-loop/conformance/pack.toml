schema = 1
runner_protocol = "fkst-declarative-rulepack@1"
owner_package = "platform-test-loop"

[[rules]]
id = "platform-test-loop-no-fixed-host-config"
severity = "error"
kind = "text_forbid_regex"
include = ["**/*.lua"]
exclude = ["tests/**", "packages/platform-test-loop/tests/**"]
pattern = "(localhost:[0-9]+|(APP|HOST)_[A-Z0-9_]+)"
message = "platform-test-loop must not encode fixed application endpoints or host environment conventions"
