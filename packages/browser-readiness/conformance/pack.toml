schema = 1
runner_protocol = "fkst-declarative-rulepack@1"
owner_package = "browser-readiness"

[[rules]]
id = "no-browser-secret-fields"
severity = "error"
kind = "text_forbid_regex"
include = ["core.lua", "departments/**/*.lua", "raisers/**/*.lua", "packages/browser-readiness/core.lua", "packages/browser-readiness/departments/**/*.lua", "packages/browser-readiness/raisers/**/*.lua"]
exclude = ["tests/**", "packages/browser-readiness/tests/**"]
pattern = "cookie|password|token|localStorage|sessionStorage"
message = "browser readiness contracts must not carry credentials or browser storage"
