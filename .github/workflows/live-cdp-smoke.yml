name: live-cdp-smoke

on:
  workflow_dispatch:
    inputs:
      substrate_ref:
        description: "fkst-substrate ref to build fkst-framework from"
        default: ""
        required: false

concurrency:
  group: live-cdp-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-cdp-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fkst-packages-testing
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Hydrate pinned fkst-packages source
        shell: bash
        run: |
          set -euo pipefail
          pin="$(sed -n '/^[0-9a-fA-F]\{40\}$/{p;q;}' .fkst/conformance/fkst-packages.pin)"
          [ -n "$pin" ] || { echo "missing fkst-packages pin in .fkst/conformance/fkst-packages.pin" >&2; exit 1; }
          mkdir -p .fkst/run
          git clone --no-checkout https://github.com/ChronoAIProject/fkst-packages.git .fkst/run/fkst-packages-conformance
          git -C .fkst/run/fkst-packages-conformance checkout "$pin"
          echo "fkst-packages pin: $pin"

      - name: Resolve fkst-substrate source pin
        id: substrate_ref
        shell: bash
        run: |
          set -euo pipefail
          ref="${{ github.event.inputs.substrate_ref }}"
          if [ -z "$ref" ]; then
            ref="$(sed -n '/^[0-9a-fA-F]\{40\}$/{p;q;}' .fkst/substrate-ref 2>/dev/null || true)"
          fi
          [[ "$ref" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "fkst-substrate ref must be a full SHA: $ref" >&2
            exit 1
          }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "fkst-substrate ref: $ref"

      - name: Checkout fkst-substrate
        uses: actions/checkout@v4
        with:
          repository: ChronoAIProject/fkst-substrate
          ref: ${{ steps.substrate_ref.outputs.ref }}
          path: fkst-substrate

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fkst-substrate

      - name: Build fkst-framework
        working-directory: fkst-substrate
        run: cargo build -p fkst-framework

      - name: Start loopback fixture app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .fkst/run/live-cdp-fixture
          {
            printf '%s\n' '<!doctype html>'
            printf '%s\n' '<html lang="en">'
            printf '%s\n' '  <head>'
            printf '%s\n' '    <meta charset="utf-8">'
            printf '%s\n' '    <title>FKST live CDP smoke fixture</title>'
            printf '%s\n' '  </head>'
            printf '%s\n' '  <body>'
            printf '%s\n' '    <main id="app">FKST live CDP smoke fixture ready</main>'
            printf '%s\n' '  </body>'
            printf '%s\n' '</html>'
          } > .fkst/run/live-cdp-fixture/index.html
          python3 -m http.server 8317 \
            --bind 127.0.0.1 \
            --directory .fkst/run/live-cdp-fixture \
            > .fkst/run/live-cdp-fixture/server.log 2>&1 &
          echo "$!" > .fkst/run/live-cdp-fixture/server.pid
          for _ in $(seq 1 50); do
            if curl -fsS --max-time 1 http://127.0.0.1:8317/ >/dev/null; then
              exit 0
            fi
            sleep 0.2
          done
          cat .fkst/run/live-cdp-fixture/server.log >&2
          exit 1

      - name: Start Chrome CDP
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          [ -n "$chrome" ] || { echo "Chrome/Chromium is required for live CDP smoke" >&2; exit 1; }
          mkdir -p .fkst/run/live-cdp-chrome
          "$chrome" \
            --headless=new \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9222 \
            --user-data-dir="$RUNNER_TEMP/fkst-live-cdp-profile" \
            --no-first-run \
            --no-default-browser-check \
            --no-sandbox \
            --disable-dev-shm-usage \
            about:blank > .fkst/run/live-cdp-chrome/chrome.log 2>&1 &
          echo "$!" > .fkst/run/live-cdp-chrome/chrome.pid
          for _ in $(seq 1 50); do
            if curl -fsS --max-time 1 http://127.0.0.1:9222/json/version >/dev/null; then
              exit 0
            fi
            sleep 0.2
          done
          cat .fkst/run/live-cdp-chrome/chrome.log >&2
          exit 1

      - name: Run live CDP smoke
        env:
          BIN: ${{ github.workspace }}/fkst-substrate/target/debug/fkst-framework
          FKST_LIVE_BASE_URL: http://127.0.0.1:8317
          FKST_LIVE_CDP_URL: http://127.0.0.1:9222
        run: |
          test -x "$BIN"
          scripts/run.sh live-cdp-smoke

      - name: Stop live smoke processes
        if: always()
        shell: bash
        run: |
          if [ -f .fkst/run/live-cdp-chrome/chrome.pid ]; then
            kill "$(cat .fkst/run/live-cdp-chrome/chrome.pid)" 2>/dev/null || true
          fi
          if [ -f .fkst/run/live-cdp-fixture/server.pid ]; then
            kill "$(cat .fkst/run/live-cdp-fixture/server.pid)" 2>/dev/null || true
          fi

      - name: Upload live CDP artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-cdp-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .testing/runs/**
            .fkst/run/live-cdp-fixture/**
            .fkst/run/live-cdp-chrome/**
          if-no-files-found: ignore
          retention-days: 14
